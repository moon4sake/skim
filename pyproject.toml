[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skim"
version = "1.0.0"
description = "SKIM: position-aware structured pruning and constrained distillation for tool-calling LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flash-linear-attention==0.3.2",
    "huggingface-hub>=1.11",
    "numpy>=2.0",
    "torch==2.7.1",
    "tqdm>=4.67",
    "transformers==5.5.4",
    "xgrammar==0.1.32",
]

[project.optional-dependencies]
lora = ["accelerate==1.4.0", "bitsandbytes==0.45.3", "peft==0.13.2"]

[project.scripts]
skim-prune = "skim.cli.prune:main"
skim-distill = "skim.cli.distill:main"
skim-eval = "skim.cli.evaluate:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["skim*"]
